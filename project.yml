# XcodeGen spec. On CI: brew install xcodegen && xcodegen generate. Nothing generated is committed.
name: Picklist
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-AU
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Picklist:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.picklist
        PRODUCT_NAME: Picklist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(PL_PROFILE_APP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Picklist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan barcodes and labels while picking, packing and receiving.
        NSPhotoLibraryUsageDescription: Choose a photo of a label to read its barcode.
        NSPhotoLibraryAddUsageDescription: Save label photos to your library.
