name: testflight
# Signs Strapify Picklist and uploads it to TestFlight. Runs ONLY by hand
# (Actions > testflight > Run workflow), after the build job passes on the same commit.
# Needs these repository secrets (same team, API key and certificate as Keywise/PickleScore):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DIST_P12, DIST_P12_PASSWORD
#   PROFILE_APP   base64 of the "Picklist App Store" profile (au.com.strapify.picklist)
# A new build is only needed for native changes: the app shows the live web picklist.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/build.yml

  upload:
    needs: gate
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_P12: ${{ secrets.DIST_P12 }}
      DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
      PROFILE_APP: ${{ secrets.PROFILE_APP }}
    steps:
      - name: Check the signing secrets are set
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_P12 DIST_P12_PASSWORD PROFILE_APP; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight upload needs these repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
      - name: Use the newest Xcode (new devices like the Duo only get native layout from the newest SDK)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key and export options
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" Config-ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Install the certificate and profile
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/keys/dist.p12"
          security import "$RUNNER_TEMP/keys/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/keys/dist.p12"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_APP" | base64 --decode > "$PROFILES/picklist-app.mobileprovision"

      - name: Archive (signed, build number = run number)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Picklist.xcodeproj \
            -scheme Picklist \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Picklist.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PL_PROFILE_APP="Picklist App Store" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error|warning: .*sign|ARCHIVE|\*\*" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Picklist.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/upload.log" | grep -E "error|Upload|EXPORT|\*\*" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/upload.log"

      - name: Remove the API key and signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/picklist-"*.mobileprovision

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
